name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_pgsql, gd, intl, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      # public/build di-commit karena Vercel tidak bisa build CSS (butuh vendor/ PHP).
      # Gagal jika hasil build terbaru berbeda dari yang di-commit: jalankan `npm run build` lalu commit.
      - name: Pastikan public/build sudah diperbarui
        run: |
          git add -N public/build
          git diff --exit-code --stat -- public/build

      # Test memakai SQLite in-memory & disk lokal (lihat phpunit.xml), tidak menyentuh Supabase.
      - name: Run Tests
        run: ./vendor/bin/pest
